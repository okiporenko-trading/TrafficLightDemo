name: TrafficLightDemo
options:
  bundleIdPrefix: com.example
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_VERSION: "5.0"
packages: {}
targets:
  TrafficLightDemo:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: TrafficLightDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TrafficLightDemo
        PRODUCT_NAME: TrafficLightDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    scheme:
      testTargets: []
